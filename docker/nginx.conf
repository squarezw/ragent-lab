# Empty keys are not rate-limited: catalogs and health remain freely available.
map $uri $lab_limit_key {
    default "";
    ~^/api/(chunking|embedding)/run$ $binary_remote_addr;
}
limit_req_zone $lab_limit_key zone=lab_api:10m rate=20r/m;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16m;
    # This container is bound only to host loopback. Host Nginx overwrites X-Real-IP.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location /api/ {
        limit_req zone=lab_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        # API keys only travel in request bodies. Do not log request payloads.
        access_log off;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
