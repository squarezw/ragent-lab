name: ragent-lab
services:
  api:
    image: ${API_IMAGE:-ragent-lab-api:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    volumes:
      - model-cache:/cache/huggingface
    mem_limit: 5g
    cpus: 2.0
    networks: [lab]
  web:
    image: ${WEB_IMAGE:-ragent-lab-web:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LAB_PORT:-8501}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [lab]
volumes:
  model-cache:
networks:
  lab:
