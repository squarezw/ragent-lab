name: ragent-lab
services:
  api:
    image: ${API_IMAGE:-ragent-lab-api:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    volumes:
      - model-cache:/cache/huggingface
      - ${LAB_VISION_SAMPLES:-/opt/rag-lab/vision-samples}:/samples:ro
      - ${LAB_VISION_PROMPTS:-/opt/rag-lab/vision-prompts}:/prompts:ro
      - vision-uploads:/data/vision-uploads
    environment:
      VISION_SAMPLES_DIR: /samples
      VISION_PROMPTS_DIR: /prompts
      VISION_UPLOAD_DIR: /data/vision-uploads
    mem_limit: 5g
    cpus: 2.0
    networks: [lab]
  web:
    image: ${WEB_IMAGE:-ragent-lab-web:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LAB_PORT:-8501}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [lab]
volumes:
  model-cache:
  vision-uploads:
networks:
  lab:
